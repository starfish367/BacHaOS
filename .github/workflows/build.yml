name: Build Bac Ha OS ISO

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Phiên bản phát hành (ví dụ: 0.1.3)"
        required: true
        default: "0.1.4"

permissions:
  contents: write

concurrency:
  group: bacha-release-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release version
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'Validated release version: %s\n' "$VERSION"

  build:
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        edition:
          - name: mate
            iso_url: https://mirrors.edge.kernel.org/linuxmint/stable/22.3/linuxmint-22.3-mate-64bit.iso
          - name: cinnamon
            iso_url: https://mirrors.edge.kernel.org/linuxmint/stable/22.3/linuxmint-22.3-cinnamon-64bit.iso
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim build disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            squashfs-tools xorriso isolinux syslinux-utils genisoimage rsync p7zip-full curl \
            shellcheck desktop-file-utils

      - name: Download and verify Linux Mint base ISO (${{ matrix.edition.name }})
        run: |
          set -euo pipefail
          ISO_URL='${{ matrix.edition.iso_url }}'
          ISO_NAME="$(basename "$ISO_URL")"
          ISO_DIR="$(dirname "$ISO_URL")"
          download() {
            curl --fail --location --retry 4 --retry-all-errors --retry-delay 5 \
              --connect-timeout 30 --max-time 1800 --speed-time 120 --speed-limit 1024 \
              --output "$2" "$1"
          }
          download "$ISO_URL" mint-base.iso
          download "${ISO_DIR}/sha256sum.txt" sha256sum.txt
          EXPECTED_SHA256="$(awk -v file="$ISO_NAME" '$2 == "*" file || $2 == file {print $1; exit}' sha256sum.txt)"
          [[ "$EXPECTED_SHA256" =~ ^[[:xdigit:]]{64}$ ]]
          printf '%s  %s\n' "$EXPECTED_SHA256" mint-base.iso | sha256sum --check --status --strict
          test "$(stat -c%s mint-base.iso)" -gt 1000000000

      - name: Lint remaster scripts
        run: |
          set -euo pipefail
          bash -n scripts/build.sh scripts/customize.sh
          shellcheck -x scripts/build.sh scripts/customize.sh assets/bacha-os-hello/bacha-os-hello
          desktop-file-validate assets/bacha-os-hello/*.desktop assets/zalo/*.desktop assets/youtube/*.desktop
          bash tests/test-bacha-os-hello.sh

      - name: Run remaster script
        run: |
          set -euo pipefail
          chmod +x scripts/build.sh
          sudo ./scripts/build.sh mint-base.iso \
            '${{ github.event.inputs.version }}' \
            '${{ matrix.edition.name }}'

      - name: Validate build outputs
        run: |
          set -euo pipefail
          source "output/release-${{ matrix.edition.name }}.env"
          test -s "output/${ISO_FILENAME}"
          test -s "output/${ISO_FILENAME}.sha256"
          test -s "output/installed-packages-${{ matrix.edition.name }}.txt"
          test -s "output/flatpak-apps-${{ matrix.edition.name }}.txt"
          (cd output && sha256sum --check "${ISO_FILENAME}.sha256")
          grep -F "${ISO_SHA256}" "output/${ISO_FILENAME}.sha256"

      - name: Upload ISO and checksum to SourceForge
        env:
          SF_SSH_PRIVATE_KEY: ${{ secrets.SF_SSH_PRIVATE_KEY }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
        run: |
          set -euo pipefail
          test -n "$SF_SSH_PRIVATE_KEY"
          test -n "$SF_USERNAME"
          source "output/release-${{ matrix.edition.name }}.env"
          install -d -m 700 ~/.ssh
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$SF_SSH_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          ssh-keyscan -T 20 -H frs.sourceforge.net >> ~/.ssh/known_hosts
          rsync --archive --verbose --partial --append-verify \
            -e "ssh -i $KEY_FILE -o StrictHostKeyChecking=yes" \
            "output/${ISO_FILENAME}" "output/${ISO_FILENAME}.sha256" \
            "${SF_USERNAME}@frs.sourceforge.net:/home/frs/project/bac-ha-os/"
          ssh -i "$KEY_FILE" -o StrictHostKeyChecking=yes "${SF_USERNAME}@frs.sourceforge.net" \
            "test -s /home/frs/project/bac-ha-os/${ISO_FILENAME} && test -s /home/frs/project/bac-ha-os/${ISO_FILENAME}.sha256"

      - name: Upload release reports
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.edition.name }}
          if-no-files-found: error
          path: |
            output/installed-packages-${{ matrix.edition.name }}.txt
            output/flatpak-apps-${{ matrix.edition.name }}.txt
            output/release-${{ matrix.edition.name }}.env
            output/bac-ha-os-${{ matrix.edition.name }}-*.iso.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download build reports
        uses: actions/download-artifact@v4
        with:
          path: output
          pattern: reports-*
          merge-multiple: true

      - name: Build release notes
        run: |
          set -euo pipefail
          source output/release-mate.env
          MATE_FILENAME="$ISO_FILENAME"
          MATE_SHA256="$ISO_SHA256"
          MATE_URL="$SOURCEFORGE_ISO_URL"
          MATE_SUM_URL="$SOURCEFORGE_SHA256_URL"
          source output/release-cinnamon.env
          CINNAMON_FILENAME="$ISO_FILENAME"
          CINNAMON_SHA256="$ISO_SHA256"
          CINNAMON_URL="$SOURCEFORGE_ISO_URL"
          CINNAMON_SUM_URL="$SOURCEFORGE_SHA256_URL"
          for required_file in \
            output/installed-packages-mate.txt \
            output/installed-packages-cinnamon.txt \
            output/flatpak-apps-mate.txt \
            output/flatpak-apps-cinnamon.txt \
            "output/${MATE_FILENAME}.sha256" \
            "output/${CINNAMON_FILENAME}.sha256"; do
            test -s "$required_file"
          done
          cat > release-notes.md <<EOF
          ## Bạc Hà OS ${{ github.event.inputs.version }}

          Bản phát hành này củng cố pipeline remaster và kiểm tra phát hành: ISO Linux Mint gốc được đối chiếu SHA-256, output được kiểm tra lại trước khi upload và GitHub Release chỉ được tạo sau khi ISO cùng checksum đã được upload lên SourceForge.

          ### Tải ISO từ SourceForge

          | Edition | ISO | SHA-256 |
          | --- | --- | --- |
          | MATE | [${MATE_FILENAME}](${MATE_URL}) | ${MATE_SHA256} · [tệp checksum](${MATE_SUM_URL}) |
          | Cinnamon | [${CINNAMON_FILENAME}](${CINNAMON_URL}) | ${CINNAMON_SHA256} · [tệp checksum](${CINNAMON_SUM_URL}) |

          Hãy đối chiếu SHA-256 trước khi tạo USB boot. Báo cáo danh sách gói và checksum cũng được đính kèm tại GitHub Release này.
          EOF

      - name: Create GitHub Release with SourceForge links
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Bạc Hà OS v${{ github.event.inputs.version }}
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            output/installed-packages-mate.txt
            output/installed-packages-cinnamon.txt
            output/flatpak-apps-mate.txt
            output/flatpak-apps-cinnamon.txt
            output/*.iso.sha256
          fail_on_unmatched_files: true
