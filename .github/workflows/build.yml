name: Build Bac Ha OS ISO

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Phiên bản'
        required: true
        default: '0.1'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition:
          - name: mate
            iso_url: 'https://mirrors.kernel.org/linuxmint/stable/22/linuxmint-22-mate-64bit.iso'
          - name: cinnamon
            iso_url: 'https://mirrors.kernel.org/linuxmint/stable/22/linuxmint-22-cinnamon-64bit.iso'

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xorriso isolinux \
            syslinux-utils genisoimage rsync p7zip-full

      - name: Download Mint ISO (${{ matrix.edition.name }})
        run: wget -q "${{ matrix.edition.iso_url }}" -O mint-base.iso
      - name: Show installed packages
        run: cat output/installed-packages-*.txt

      - name: Upload package list
        uses: actions/upload-artifact@v4
        with:
          name: installed-packages-${{ matrix.edition.name }}
          path: output/installed-packages-*.txt

      - name: Run remaster script
        run: |
          chmod +x scripts/build.sh
          sudo ./scripts/build.sh mint-base.iso \
            "${{ github.event.inputs.version }}" \
            "${{ matrix.edition.name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bac-ha-os-${{ matrix.edition.name }}
          path: output/bac-ha-os-${{ matrix.edition.name }}-*.iso

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all ISOs
        uses: actions/download-artifact@v4
        with:
          path: output
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          files: output/*.iso
