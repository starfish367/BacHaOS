name: Build Bac Ha OS ISO
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Phiên bản'
        required: true
        default: '0.1.1'
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition:
          - name: mate
            iso_url: 'https://mirrors.kernel.org/linuxmint/stable/22.3/linuxmint-22.3-mate-64bit.iso'
          - name: cinnamon
            iso_url: 'https://mirrors.kernel.org/linuxmint/stable/22.3/linuxmint-22.3-cinnamon-64bit.iso'
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xorriso isolinux \
            syslinux-utils genisoimage rsync p7zip-full
      - name: Download Mint ISO (${{ matrix.edition.name }})
        run: |
          wget -q "${{ matrix.edition.iso_url }}" -O mint-base.iso
          SIZE=$(stat -c%s mint-base.iso 2>/dev/null || echo 0)
          echo "Kích thước file tải về: $SIZE bytes"
          if [ "$SIZE" -lt 1000000000 ]; then
            echo "LỖI: File ISO tải về quá nhỏ — link sai hoặc mirror lỗi"
            exit 1
          fi
      - name: Run remaster script
        run: |
          chmod +x scripts/build.sh
          sudo ./scripts/build.sh mint-base.iso \
            "${{ github.event.inputs.version }}" \
            "${{ matrix.edition.name }}"

      - name: Upload ISO to SourceForge
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SF_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H frs.sourceforge.net >> ~/.ssh/known_hosts

          ISO_FILE=$(ls output/bac-ha-os-${{ matrix.edition.name }}-*.iso)

          rsync -avP -e "ssh -i ~/.ssh/id_rsa" \
            "$ISO_FILE" \
            "${{ secrets.SF_USERNAME }}@frs.sourceforge.net:/home/frs/project/bac-ha-os/"

          echo "Đã upload $(basename $ISO_FILE) lên SourceForge"

      - name: Show app & package lists
        run: |
          echo "===== Flatpak apps ====="
          cat output/flatpak-apps-*.txt
          echo ""
          echo "===== Installed APT packages (top 40 nặng nhất) ====="
          cat output/installed-packages-*.txt

      - name: Save full package list to repo docs
        run: |
          mkdir -p docs
          {
            echo "# Danh sách gói APT - Bạc Hà OS (${{ matrix.edition.name }})"
            echo ""
            echo "Cập nhật tự động: $(date +%Y-%m-%d)"
            echo ""
            echo "| Package | Size (KB) | Version |"
            echo "|---|---|---|"
            awk -F'\t' '{print "| "$1" | "$2" | "$3" |"}' output/installed-packages-${{ matrix.edition.name }}.txt
          } > docs/app-list-${{ matrix.edition.name }}.md

      - name: Commit package list to repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/app-list-${{ matrix.edition.name }}.md
          git diff --staged --quiet || git commit -m "Cập nhật danh sách gói APT (${{ matrix.edition.name }})"

          # Thử push, nếu bị rejected do có commit mới từ job song song, pull rebase rồi thử lại
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push thất bại, thử lại lần $i..."
            sleep $((RANDOM % 10 + 5))
          done

      - name: Upload app/package lists
  uses: actions/upload-artifact@v4
  with:
    name: reports-${{ matrix.edition.name }}
    path: |
      output/flatpak-apps-*.txt
      output/installed-packages-*.txt
   # Thêm bước kiểm tra file không rỗng
   if: always()


  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download reports only
        uses: actions/download-artifact@v4
        with:
          path: output
          pattern: reports-*
          merge-multiple: true

      - name: Create GitHub Release with SourceForge links
  uses: softprops/action-gh-release@v2
  with:
    tag_name: v${{ github.event.inputs.version }}
    body: |
      ## Tải Bạc Hà OS ${{ github.event.inputs.version }}
      - MATE: https://sourceforge.net/projects/bac-ha-os/files/bac-ha-os-mate-${{ github.event.inputs.version }}-*.iso/download
      - Cinnamon: https://sourceforge.net/projects/bac-ha-os/files/bac-ha-os-cinnamon-${{ github.event.inputs.version }}-*.iso/download
    files: |
      output/installed-packages-mate.txt
      output/installed-packages-cinnamon.txt
      output/flatpak-apps-mate.txt
      output/flatpak-apps-cinnamon.txt
